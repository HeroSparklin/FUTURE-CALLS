name: Herocallss Bot

on:
  schedule:
    # 7 UTC = 8AM Lagos Watchlist | 8 UTC = 9AM Lagos Alive | 9,12,15,18,21 = normal scans
    - cron: "0 7,8,9,12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
