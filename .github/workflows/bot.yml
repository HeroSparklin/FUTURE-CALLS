name: Ultimate 80% Bot
on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ccxt requests
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add seen_all.json last_alive_all.json || true
          git commit -m "update seen" || true
          git push || true
