name: Crypto Calls Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ccxt pandas numpy requests python-telegram-bot || true

      - name: Restore seen cache
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            last_alive.txt
          key: seen-cache-v1
          restore-keys: |
            seen-cache-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BROADCAST_ID: ${{ secrets.TELEGRAM_BROADCAST_ID }}
        run: |
          python bot.py

      - name: Save seen cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen.json
            last_alive.txt
          key: seen-cache-v1

      - name: Keep workflow alive
        if: github.event_name == 'schedule'
        run: |
          echo "Last run $(date -u)" > .last_run
