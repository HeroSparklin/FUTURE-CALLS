name: Gate Perfect 85% Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install ccxt requests
      - uses: actions/cache/restore@v4
        with:
          path: |
            seen_all.json
            alive.json
          key: bot-cache-v1-${{ github.run_number }}
          restore-keys: bot-cache-v1-
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen_all.json
            alive.json
          key: bot-cache-v1-${{ github.run_number }}
