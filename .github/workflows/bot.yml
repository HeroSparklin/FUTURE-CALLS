import os
import requests

BOT_TOKEN = os.getenv("BOT_TOKEN")
CHAT_ID = os.getenv("CHAT_ID")

print(f"TOKEN exists: {bool(BOT_TOKEN)}")
print(f"CHAT_ID exists: {bool(CHAT_ID)}")

url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

message = """✅ CONFIRMED: @Herocallss is ACTIVE & CONNECTED

Your bot is online and linked to this channel.
Connection test: SUCCESSFUL
Time: Now

70/100 scanner is ready to run.
"""

data = {
    "chat_id": CHAT_ID,
    "text": message
}

try:
    r = requests.post(url, data=data, timeout=15)
    print(f"Status: {r.status_code}")
    print(f"Response: {r.text}")
    if r.status_code == 200:
        print("SUCCESS - Check your Telegram channel now!")
    else:
        print("FAILED - Check your BOT_TOKEN / CHAT_ID or make bot admin")
except Exception as e:
    print(f"Error: {e}")
