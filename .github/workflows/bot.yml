name: Crypto Calls Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: crypto-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            last_alive.txt
          key: seen-cache-v1
          restore-keys: seen-cache-
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BROADCAST_ID: ${{ secrets.TELEGRAM_BROADCAST_ID }}
        run: python bot.py
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen.json
            last_alive.txt
          key: seen-cache-v1-${{ github.run_id }}
