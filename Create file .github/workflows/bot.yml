name: Sniper Bot - 12 Filters Locked

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual Run button

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Sniper Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BROADCAST_ID: ${{ secrets.TELEGRAM_BROADCAST_ID }}
        run: |
          python bot.py

      - name: Save Cooldown File
        # This is CRITICAL for Filter 12 Cooldown to work
        # Without this, cooldown.json resets every run
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@github.com"
          git add cooldown.json || true
          git commit -m "Update cooldown [skip ci]" || echo "No cooldown changes"
          git push || echo "Push failed - cooldown not saved"

      - name: Done
        run: echo "Scan complete - 12 Filters Locked"
